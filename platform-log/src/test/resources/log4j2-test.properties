name=logging-test
# check the configuration for changes every 60 seconds.
monitorInterval=60


#region properties
#endregion properties


#region appenders
appender.console.type=Console
appender.console.name=CONSOLE
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%d{ISO8601}] [%-5level] %l :: %t - %msg%n
#endregion appenders

#region logs
rootLogger.level=off
rootLogger.appenderRefs=
logger.platform-log.name=com.github.emw7.platform.log
logger.platform-log.level=all
#endregion logs
